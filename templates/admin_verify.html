<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/logo-gobierno.png" />
  <title>Verificación - Prevención del Delito</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #0A2B5E;
      --primary-dark: #061B3D;
      --surface-container-lowest: #FFFFFF;
      --on-surface: #0B1C30;
      --on-surface-variant: #45464D;
      --outline-variant: #C6C6CD;
      --error: #BA1A1A;
      --success: #16a34a;
      --font: 'Inter', system-ui, sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--primary-dark);
      color: var(--on-surface);
      -webkit-font-smoothing: antialiased;
    }
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .login-card {
      background: var(--surface-container-lowest);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    }
    .login-card h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
      text-align: center;
    }
    .login-card p {
      font-size: 0.8125rem;
      color: var(--on-surface-variant);
      margin-bottom: 28px;
      text-align: center;
    }
    .login-card label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--on-surface);
      margin-bottom: 4px;
    }
    .login-card input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border: 1px solid var(--outline-variant);
      border-radius: 8px;
      font: inherit;
      font-size: 1.25rem;
      letter-spacing: 8px;
      text-align: center;
      outline: none;
      margin-bottom: 16px;
    }
    .login-card input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(10,43,94,0.1);
    }
    .login-card button {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
    }
    .login-card button:hover { background: var(--primary-dark); }
    .login-card .btn-link {
      background: none;
      color: var(--primary);
      font-size: 0.8125rem;
      margin-top: 8px;
      text-decoration: underline;
      cursor: pointer;
    }
    .login-card .btn-link:hover { color: var(--primary-dark); background: none; }
    .login-error {
      color: var(--error);
      font-size: 0.8125rem;
      text-align: center;
      margin-top: 12px;
    }
    .phone-hint {
      font-size: 0.75rem;
      color: var(--on-surface-variant);
      text-align: center;
      margin-bottom: 20px;
      background: #f5f5f5;
      padding: 8px 12px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <div style="text-align:center;margin-bottom:16px;">
        <img src="/logo-gobierno.png" alt="Logo" style="width:48px;height:48px;object-fit:contain;border-radius:6px;" />
      </div>
      <h1>Verificación en dos pasos</h1>
      <p>Ingrese el código enviado a su correo electrónico</p>
      {% if email_mask %}
      <div class="phone-hint">Código enviado a <strong>{{ email_mask }}</strong></div>
      {% endif %}
      <form method="post">
        <label for="code">Código de verificación</label>
        <input type="text" name="code" id="code" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code" required oninput="this.value=this.value.replace(/[^0-9]/g,'');if(this.value.length===6)this.form.querySelector('button[type=submit]').click()" />
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <button type="submit">Verificar Código</button>
        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}
      </form>
      <form method="post" action="/login/resend-code" style="text-align:center;margin-top:12px;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <button type="submit" class="btn-link">Reenviar código</button>
      </form>
      <div style="text-align:center;margin-top:12px;">
        <a href="/login/logout" style="font-size:0.8125rem;color:var(--on-surface-variant);text-decoration:none;display:inline-flex;align-items:center;gap:6px;">
          Cancelar y volver al inicio
        </a>
      </div>
    </div>
  </div>
</body>
</html>
